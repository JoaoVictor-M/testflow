# Disposable overlay on top of docker-compose.yml for automated tests, e2e and DAST.
# No published ports, no named volumes and no container names: callers pick the services they need
# and pass one Compose project per worktree or run.
services:
  mongodb-service:
    restart: "no"
    volumes: !override
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  evidence-init:
    profiles: [prod-only]

  backend-service:
    restart: "no"
    env_file:
      - path: ${TESTFLOW_CI_ENV:-/dev/null}
        required: false
    environment: !override
      FRONTEND_URL: ${FRONTEND_URL:-https://nginx-service:8443}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes: !reset []
    tmpfs:
      - /evidencias_testes:uid=1000,gid=1000,mode=0700
    depends_on: !override
      mongodb-service:
        condition: service_healthy

  frontend-service:
    restart: "no"

  nginx-service:
    restart: "no"
    ports: !reset []
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-https://nginx-service:8443}
    volumes: !override
      - ${TESTFLOW_CI_TLS:-/dev/null}:/etc/nginx/ssl:ro

  # Catches every e-mail the back sends: SMTP on mailpit:1025, inbox API on mailpit:8025.
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

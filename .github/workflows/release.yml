name: release

# The owner approves the merge into main before this workflow may publish.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run checks and builds without publishing images, tags, releases or production config
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate version and release notes
        id: version
        run: |
          version=$(sh scripts/ci/release-version.sh)
          sh scripts/ci/release-notes.sh "$version" > /dev/null
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing version before running the release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/refuse-released-version.sh

  checks:
    needs: validate
    uses: ./.github/workflows/develop.yml

  dast-full:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: scripts/check.sh dast-full
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dast-full
          path: reports/zap/
          if-no-files-found: ignore

  build-prod:
    needs: [checks, dast-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: scripts/check.sh build-prod
      - run: docker save -o prod-images.tar testflow-backend:prod testflow-frontend:prod testflow-nginx:prod
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prod-images
          path: prod-images.tar
          retention-days: 1

  scan-prod:
    needs: build-prod
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prod-images
      - run: scripts/check.sh scan-prod
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom
          path: reports/release-sbom/*.spdx.json
          if-no-files-found: error

  publish:
    needs: [validate, scan-prod]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Refuse to overwrite a released version
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/refuse-released-version.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prod-images
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Push and sign the scanned images, then promote latest
        run: |
          docker load -i prod-images.tar
          image_registry="$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}"
          for component in backend frontend nginx; do
            name="testflow-$component"
            for tag in "$RELEASE_TAG" "$GITHUB_SHA"; do
              docker tag "$name:prod" "$image_registry/$name:$tag"
              docker push "$image_registry/$name:$tag"
            done
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_registry/$name:$RELEASE_TAG")
            cosign sign --yes "$digest"
          done
          for component in backend frontend nginx; do
            name="testflow-$component"
            docker tag "$name:prod" "$image_registry/$name:latest"
            docker push "$image_registry/$name:latest"
          done

  release:
    needs: [validate, publish]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: Tag VERSION and create the GitHub Release with SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/ci/refuse-released-version.sh
          sh scripts/ci/release-notes.sh "${RELEASE_TAG#v}" > notes.md
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file notes.md sbom/*.spdx.json

  update-prod-repo:
    name: Deploy to Prod Repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    needs: [validate, release]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false

      - name: Setup downcases
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Checkout Prod Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JoaoVictor-M/testflow-prod
          token: ${{ secrets.PROD_REPO_TOKEN }}
          path: prod

      - name: Format Prod Files
        run: |
          # 1. Limpeza Profunda: Remove absolutamente todos os arquivos da árvore do git na branch destino
          cd prod
          git rm -rf --ignore-unmatch .
          cd ..

          # 2. Recria os diretórios e copia cirurgicamente APENAS o necessário
          cp source/install/mongo-init.js prod/mongo-init.js
          cp source/.env.example prod/.env.example
          cp source/README.md prod/README.md
          cp source/LICENSE prod/LICENSE
          cp source/SECURITY.md prod/SECURITY.md
          # Backup: o serviço `backup` do Compose é construído de ./backup e a restauração usa scripts/restore.sh
          mkdir -p prod/scripts
          cp -R source/backup prod/backup
          cp source/scripts/restore.sh prod/scripts/restore.sh

          # 2.1 Remove a seção de 'Desenvolvimento' inteira do README.md de produção usando sed delimitado
          sed -i '/## 🛠️ Desenvolvimento (Para Code Maintainers)/,/^---$/d' prod/README.md

          printf '{"version": "%s"}\n' "$RELEASE_TAG" > prod/version.json

          # O arquivo Compose é copiado do seu código local e depois lapidado dinamicamente
          cp source/docker-compose.yml prod/docker-compose.yml

          # 3. Lapidação do docker-compose para Produção
          # Troca os builds pelas imagens na nuvem
          sed -i "s|build: ./testflow-app|image: ${REGISTRY}/${IMAGE_OWNER}/testflow-backend:${RELEASE_TAG}|g" prod/docker-compose.yml
          sed -i "s|build: ./testflow-frontend|image: ${REGISTRY}/${IMAGE_OWNER}/testflow-frontend:${RELEASE_TAG}|g" prod/docker-compose.yml
          sed -i "s|build: ./nginx|image: ${REGISTRY}/${IMAGE_OWNER}/testflow-nginx:${RELEASE_TAG}|g" prod/docker-compose.yml

          # Atualiza a rota de volume do mongo-init.js de "./install/..." para root "./mongo-init.js"
          sed -i "s|./install/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro|./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro|g" prod/docker-compose.yml

          # Remove completamente a seção ports e comentários dev-only do mongodb usando sed regex baseada em contexto
          sed -i '/mongodb-service:/,/volumes:/ { /ports:/d; /# dev-only-mongo-port/d }' prod/docker-compose.yml

          # Remove chaves de indentificadores engessados de containers de dev original
          sed -i '/container_name:/d' prod/docker-compose.yml



      - name: Push release files to Github Prod
        run: |
          cd prod
          git config user.name "GitHub Actions Deploy"
          git config user.email "actions@github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: release components and infra matching version ${RELEASE_TAG}"
          fi
          git push origin main

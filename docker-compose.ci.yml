# Disposable API stack for the existing full DAST gate; no host ports or persistent volumes.
services:
  mongodb-service:
    image: mongo:9.0.2@sha256:bac22ea7710d774103dcad3ec8ac13cba1eb378f488e3ce8a6b3a1adf2ba9dcc
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend-service:
    image: testflow-ci-backend:prod
    build:
      context: ./testflow-app
      target: prod
    env_file:
      - ${TESTFLOW_CI_ENV:?Use scripts/check.sh dast-full}
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-http://backend-service:3000}
    tmpfs:
      - /evidencias_testes:uid=1000,gid=1000,mode=0700
    depends_on:
      mongodb-service:
        condition: service_healthy

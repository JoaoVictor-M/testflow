# Browser-facing half of the disposable stack, layered over docker-compose.ci.yml by scripts/lib/ci-stack.sh
# for the e2e and DAST baseline targets: the production frontend and nginx images in front of the API,
# with HTTPS on a throwaway certificate, and the first administrator seeded by the production init script.
# Nothing is published and nothing persists.
services:
  mongodb-service:
    environment:
      - TESTFLOW_ADMIN_PASSWORD_HASH=${TESTFLOW_ADMIN_PASSWORD_HASH:-}
    volumes:
      - ./install/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  backend-service:
    environment:
      # The seed writes to testflow-db, the database the production stack uses.
      - MONGO_URI=mongodb://mongodb-service:27017/testflow-db
      - FRONTEND_URL=https://nginx-service:8443
  frontend-service:
    build:
      context: ./testflow-frontend
      target: prod
    depends_on:
      backend-service:
        condition: service_healthy
  nginx-service:
    build: ./nginx
    environment:
      - FRONTEND_URL=https://nginx-service:8443
    volumes:
      - ${TESTFLOW_CI_TLS:?Use scripts/check.sh e2e}:/etc/nginx/ssl:ro
    depends_on:
      frontend-service:
        condition: service_healthy
      backend-service:
        condition: service_healthy

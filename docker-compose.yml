services:
  mongodb-service:
    image: mongo:latest
    container_name: mongodb_testflow
    restart: always

    volumes:
      - mongo-data:/data/db
      - ./install/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  evidence-init:
    build: ./testflow-app
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["chown"]
    command: ["-Rh", "1000:1000", "/evidencias_testes"]
    volumes:
      - ./evidencias_testes:/evidencias_testes

  backend-service:
    build: ./testflow-app
    container_name: backend_testflow
    restart: always
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost/testflow}
    volumes:
      - ./evidencias_testes:/evidencias_testes
    depends_on:
      mongodb-service:
        condition: service_started
      evidence-init:
        condition: service_completed_successfully

  frontend-service:
    build: ./testflow-frontend
    container_name: frontend_testflow
    restart: always
    depends_on:
      - backend-service

  nginx-service:
    build: ./nginx
    container_name: nginx_testflow
    restart: always
    environment:
      - NGINX_PUBLIC_ORIGIN=${NGINX_PUBLIC_ORIGIN:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost/testflow}
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      - frontend-service
      - backend-service
    volumes:
      - ./certificados:/etc/nginx/ssl:ro


volumes:
  mongo-data:

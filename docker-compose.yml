# Production stack: the images' `prod` targets, HTTPS in front, nothing published but 80 and 443.
# The development stack adds docker-compose.dev.yml (scripts/dev.sh). Compose names every resource
# after its project (`testflow` by default), so the volumes keep their existing names.
services:
  mongodb-service:
    image: mongo:9.0.4@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    environment:
      - TESTFLOW_ADMIN_PASSWORD_HASH=${TESTFLOW_ADMIN_PASSWORD_HASH:-}
    volumes:
      - mongo-data:/data/db
      - ./install/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  evidence-init:
    build: ./testflow-app
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["chown"]
    command: ["-Rh", "1000:1000", "/evidencias_testes"]
    volumes:
      - ./evidencias_testes:/evidencias_testes

  backend-service:
    build: ./testflow-app
    restart: always
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost/testflow}
    volumes:
      - ./evidencias_testes:/evidencias_testes
    depends_on:
      mongodb-service:
        condition: service_healthy
      evidence-init:
        condition: service_completed_successfully

  frontend-service:
    build: ./testflow-frontend
    restart: always
    depends_on:
      backend-service:
        condition: service_healthy

  nginx-service:
    build: ./nginx
    restart: always
    environment:
      - NGINX_PUBLIC_ORIGIN=${NGINX_PUBLIC_ORIGIN:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost/testflow}
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      frontend-service:
        condition: service_healthy
      backend-service:
        condition: service_healthy
    volumes:
      - ./certificados:/etc/nginx/ssl:ro

  # Encrypted backup of the database and the evidence files; not part of the stack (profile tools):
  #   docker compose --profile tools run --rm backup
  # Needs the age public key in BACKUP_AGE_RECIPIENT (.env). The private key stays off this machine.
  # The file lands in BACKUP_DIR (default ./backups, created by you), written by UID 1000 with mode
  # 0600: that UID must be able to write the folder, and only it (or root) reads the backup. To use
  # another UID, run it with `-u <uid>:<gid>`.
  # Restore: scripts/restore.sh.
  backup:
    profiles: [tools]
    build: ./backup
    image: testflow-backup:local
    restart: "no"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      - BACKUP_AGE_RECIPIENT=${BACKUP_AGE_RECIPIENT:-}
      - BACKUP_MONGO_URI=${BACKUP_MONGO_URI:-mongodb://mongodb-service:27017/testflow-db}
    volumes:
      - ${BACKUP_EVIDENCE_DIR:-./evidencias_testes}:/evidencias_testes:ro
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  mongo-data:

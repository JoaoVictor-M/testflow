version: 2
updates:
  - package-ecosystem: npm
    directory: /testflow-app
    cooldown:
      default-days: 7
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /testflow-frontend
    cooldown:
      default-days: 7
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directories:
      - /
      - /testflow-app
      - /testflow-frontend
      - /nginx
      - /scripts/test
    target-branch: develop
    schedule:
      interval: weekly

version: 2
updates:
  - package-ecosystem: npm
    directory: /testflow-app
    cooldown:
      default-days: 7
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /testflow-frontend
    cooldown:
      default-days: 7
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tests/e2e
    cooldown:
      default-days: 7
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directories:
      - /backup
      - /testflow-app
      - /testflow-frontend
      - /nginx
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    cooldown:
      default-days: 7
    target-branch: develop
    schedule:
      interval: weekly

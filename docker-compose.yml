# Production stack: the images' `prod` targets, HTTPS in front, nothing published but 80 and 443.
# The development stack adds docker-compose.dev.yml (scripts/dev.sh). Compose names every resource
# after its project (`testflow` by default), so the volumes keep their existing names.
services:
  mongodb-service:
    image: mongo:latest
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - mongo-data:/data/db
      - ./install/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  evidence-init:
    build: ./testflow-app
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["chown"]
    command: ["-Rh", "1000:1000", "/evidencias_testes"]
    volumes:
      - ./evidencias_testes:/evidencias_testes

  backend-service:
    build: ./testflow-app
    restart: always
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost/testflow}
    volumes:
      - ./evidencias_testes:/evidencias_testes
    depends_on:
      mongodb-service:
        condition: service_healthy
      evidence-init:
        condition: service_completed_successfully

  frontend-service:
    build: ./testflow-frontend
    restart: always
    depends_on:
      backend-service:
        condition: service_healthy

  nginx-service:
    build: ./nginx
    restart: always
    environment:
      - NGINX_PUBLIC_ORIGIN=${NGINX_PUBLIC_ORIGIN:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost/testflow}
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      frontend-service:
        condition: service_healthy
      backend-service:
        condition: service_healthy
    volumes:
      - ./certificados:/etc/nginx/ssl:ro


volumes:
  mongo-data:
